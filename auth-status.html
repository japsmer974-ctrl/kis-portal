<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIS Auth Status</title>
</head>
<body>
  <h2>KIS Portal Authentication Status</h2>
  <pre id="result">Waiting for Firebase...</pre>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>

  <script>
    const output = document.getElementById("result");

    kisAuth.onAuthStateChanged(user => {
      output.textContent = JSON.stringify({
        firebaseReady: window.kisFirebaseReady,
        authAvailable: !!window.kisAuth,
        firestoreAvailable: !!window.kisDb,
        currentUser: user ? {
          uid: user.uid,
          email: user.email
        } : null
      }, null, 2);
    });
  </script>
</body>
</html>
